<!doctype html>
<html lang="en">
  <body style="background:#faf6ec;color:#241d14;font-family:Arial,sans-serif;padding:32px">
    <main style="background:#fffdf7;border:1px solid #d8c68f;max-width:520px;margin:auto;padding:32px">
      <p style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a3372f">CampusFind verification</p>
      <h1 style="font-family:Georgia,serif">Your return-ticket code</h1>
      <p>Enter this six-digit code to finish signing in:</p>
      <p style="font-family:monospace;font-size:32px;font-weight:700;letter-spacing:.2em">{{ .Token }}</p>
      <p>This code expires in one hour. If you did not request it, you can ignore this email.</p>
    </main>
  </body>
</html>
